<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рандомайзер - Бесконечная Лента</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1e1e24;
            color: #fff;
            margin-top: 50px;
        }
        .roulette-box {
            background: #2a2a35;
            padding: 30px;
            display: inline-block;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #ffc107;
        }
        .window {
            width: 350px;
            height: 350px;
            margin: 0 auto 25px;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            position: relative;
            border: 4px solid #3e3e4f;
        }
        .window::before, .window::after {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: 10px solid transparent;
            z-index: 10;
        }
        .window::before { left: 0; border-left-color: #ffc107; }
        .window::after { right: 0; border-right-color: #ffc107; }

        .tape {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            /* По умолчанию анимация включена */
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.35, 1.02);
            transform: translateY(0px);
        }
        .tape img {
            width: 350px;
            height: 350px;
            object-fit: cover;
            box-sizing: border-box;
            border-bottom: 2px solid #2a2a35;
        }
        button {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(255, 152, 0, 0.6); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }
    </style>
</head>
<body>

<div class="roulette-box">
    <h2>Сделать выбор Рандом</h2>
    <div class="window">
        <div class="tape" id="image-tape">
            <img src="img/main.jpg" alt="Главная">
        </div>
    </div>
    <button id="spin-btn" onclick="startSpinning()">Крутить</button>
</div>

<script>
    // Укажите общее количество пронумерованных картинок в папке img
    const TOTAL_IMAGES = 40; 
    const IMG_HEIGHT = 350; 

    const tape = document.getElementById('image-tape');
    const btn = document.getElementById('spin-btn');
    let availableImages = [];

    function resetPool() {
        availableImages = [];
        for (let i = 1; i <= TOTAL_IMAGES; i++) {
            availableImages.push(i);
        }
    }
    resetPool();

    // Генерируем ленту. Делаем её структуру строго предсказуемой:
    // Позиция 0: main.jpg
    // Позиции 1..TOTAL_IMAGES: первый круг (сюда мы будем прыгать без анимации для сброса)
    // Позиции (круг 2, 3, 4): зоны разгона и финала
    function buildTape() {
        tape.innerHTML = '<img src="img/main.jpg" alt="Главная">';
        // Делаем 4 круга повторений картинок
        for (let round = 0; round < 4; round++) {
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const img = document.createElement('img');
                img.src = `img/${i}.jpg`;
                tape.appendChild(img);
            }
        }
    }
    buildTape();

    function startSpinning() {
        btn.disabled = true;

        // Выбираем финальную картинку из оставшихся в пуле
        const finalPoolIndex = Math.floor(Math.random() * availableImages.length);
        const finalImageNumber = availableImages[finalPoolIndex];

        // МГНОВЕННЫЙ СБРОС НАВЕРХ: Перед каждым новым кручением мы сбрасываем ленту на 1-й круг.
        // Если до этого лента стояла на картинке Х, мы находим точно такую же картинку Х на самом первом круге
        // и перемещаем ленту туда мгновенно (transition = 'none'). Пользователь этого не заметит!
        const currentSrc = tape.getElementsByTagName('img')[targetGlobalIndex || 0]?.getAttribute('src');
        
        // Отключаем плавность для незаметного прыжка вверх
        tape.style.transition = 'none';
        
        let resetIndex = 0;
        if (currentSrc && currentSrc !== 'img/main.jpg') {
            // Ищем эту же картинку в пределах первого круга (индексы от 1 до TOTAL_IMAGES)
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                if (`img/${i}.jpg` === currentSrc) {
                    resetIndex = i;
                    break;
                }
            }
        }
        
        // Мгновенно смещаем ленту в верхнюю стартовую позицию
        tape.style.transform = `translateY(${-(resetIndex * IMG_HEIGHT)}px)`;

        // Даем браузеру 50мс прийти в себя, вернуть анимацию и начать крутить только ВНИЗ (лента едет вверх)
        setTimeout(() => {
            tape.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.85, 0.35, 1.02)';
            
            // Финал настраиваем на самый ПРЕДПОСЛЕДНИЙ круг (чтобы крутилось долго и всегда в одну сторону)
            // Формула гарантирует, что целевой индекс всегда будет больше, чем resetIndex
            const targetRound = 3; 
            targetGlobalIndex = ((targetRound - 1) * TOTAL_IMAGES) + finalImageNumber;

            // Запуск прокрутки вперед
            tape.style.transform = `translateY(${-(targetGlobalIndex * IMG_HEIGHT)}px)`;
            
            // Удаляем выпавшую картинку из черного списка
            availableImages.splice(finalPoolIndex, 1);
        }, 50);

        // Ждем окончания анимации (3.5 секунды + запас на старт)
        setTimeout(() => {
            btn.disabled = false;

            if (availableImages.length === 0) {
                alert("Все картинки показаны! Начинаем новый круг.");
                resetPool();
            }
        }, 3600);
    }

    // Вспомогательная переменная, чтобы помнить, где остановились
    let targetGlobalIndex = 0;
</script>

</body>
</html>
